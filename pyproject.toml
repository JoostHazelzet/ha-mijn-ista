# Local development environment (notebooks, experiments). Not used by Home
# Assistant: the integration's runtime requirements live in manifest.json.
[project]
name = "mijn-ista"
version = "0.1.0"
description = "HomeAssistant Ista integration — local dev/notebook environment"
requires-python = ">=3.13"
dependencies = [
    # Jupyter environment
    "jupyter",
    "ipykernel",
    "ipywidgets>=8.0.0",

    # Local API development; Home Assistant adoption waits for publication.
    "mijn-ista-api-community==0.2.0",
    "mijn-ista-client==0.1.0",
    "aiohttp",

    "python-dotenv",
]

[tool.uv]
# This repo is not an installable package; only manage the environment.
package = false

[tool.uv.sources]
mijn-ista-api-community = { path = "packages/mijn-ista-api", editable = true }
mijn-ista-client = { path = "packages/mijn-ista-client", editable = true }

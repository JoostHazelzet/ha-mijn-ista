# Local development environment (notebooks, experiments). Not used by Home
# Assistant: the integration's runtime requirements live in manifest.json.
[project]
name = "mijn-ista"
version = "0.1.0"
description = "HomeAssistant Ista integration — local dev/notebook environment"
requires-python = ">=3.13"
dependencies = [
    # Jupyter environment
    "jupyter",
    "ipykernel",
    "ipywidgets>=8.0.0",

    # Local API development; Home Assistant adoption waits for publication.
    "mijn-ista-client==0.1.0",
    "aiohttp",

    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff",
]
integration = [
    "pytest-homeassistant-custom-component",
    "pytest-cov",
    # Match the integration manifest until the standalone client is published.
    "mijn-ista-api==0.2.0",
]

[tool.uv]
# This repo is not an installable package; only manage the environment.
package = false

[tool.uv.dependency-groups]
# Home Assistant's test stack has a stricter floor than the standalone client.
integration = { requires-python = ">=3.13.2" }

[tool.uv.sources]
mijn-ista-client = { path = "packages/mijn-ista-client", editable = true }

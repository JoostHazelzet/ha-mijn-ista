# Local development environment (notebooks, experiments). Not used by Home
# Assistant: the integration's runtime requirements live in manifest.json.
[project]
name = "mijn-ista"
version = "0.1.0"
description = "HomeAssistant Ista integration — local dev/notebook environment"
requires-python = ">=3.13"
dependencies = [
    # Jupyter environment
    "jupyter",
    "ipykernel",
    "ipywidgets>=8.0.0",

    # Keep in sync with custom_components/mijn_ista/manifest.json
    "mijn-ista-api==0.2.0",
    "aiohttp",

    "python-dotenv",
]

[tool.uv]
# This repo is not an installable package; only manage the environment.
package = false

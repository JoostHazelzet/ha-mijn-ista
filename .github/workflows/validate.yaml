name: Validate with hassfest and HACS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_standalone_api:
    name: "Standalone API (no Home Assistant)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install './packages/mijn-ista-api[test]' './packages/mijn-ista-client[test]'
      - run: python -m pytest -q
        working-directory: packages/mijn-ista-api
      - run: python -m pytest -q
        working-directory: packages/mijn-ista-client

  validate_hacs:
    name: "HACS Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: "integration"

  validate_hassfest:
    name: "Hassfest Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

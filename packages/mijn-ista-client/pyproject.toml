[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mijn-ista-client"
version = "0.1.0"
description = "Standalone resilient async client for the Dutch mijn.ista.nl portal"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mijn-ista-api-community==0.2.0",
    "aiohttp>=3.12",
    "yarl>=1.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/mijn_ista_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
